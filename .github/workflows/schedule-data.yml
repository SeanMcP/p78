# Rebuilds the schedule data in data/ from PRT's GTFS feed and publishes it when it changes.
name: Update schedule data

on:
  schedule:
    - cron: '17 10 * * *' # Daily. Off the hour, when GitHub delays fewer scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download PRT's GTFS feed
        run: |
          curl -fsSL -o "$RUNNER_TEMP/GTFS.zip" https://www.rideprt.org/developerresources/GTFS.zip
          unzip -q "$RUNNER_TEMP/GTFS.zip" -d "$RUNNER_TEMP/GTFS"

      - run: node scripts/build-stops.mjs "$RUNNER_TEMP/GTFS"

      # PRT uploads the zip daily even when the schedule is the same, so compare the output, not the zip.
      - name: Commit and publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data extension/stops.json
          if git diff --cached --quiet; then
            echo "Schedule data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update schedule data from PRT's GTFS feed"
          git push
          # Pushes made with this workflow's token don't start a Pages build, so request one.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
